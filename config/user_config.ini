
[Settings]

; 使用自己的频道模板和订阅源
source_file = config/user_demo.txt
subscribe_file = config/user_subscribe.txt
final_file = output/user_result.txt

; 输出设置
open_update = True
open_update_time = True
open_m3u_result = True
open_epg = True
open_subscribe_epg = False
output_urls_limit = 3

; 数据源设置
open_local = True
open_subscribe = True
open_auto_disable_source = False
open_history = True
open_headers = True

; 测速设置
open_speed_test = True
speed_test_mode = quick
speed_test_target = 3
open_full_speed_test = False

; 初次运行放宽分辨率过滤
open_filter_resolution = False
open_filter_speed = True
min_speed = 0.2
open_filter_ad = True

; 不强制限制运营商和归属地
location =
isp =
open_supply = False

; IPv4 / IPv6 都保留
ipv_type = all
ipv_type_prefer = auto
ipv6_support = False

; 排序优先级
sort_by = speed,delay

; 关闭推流功能
open_rtmp = False

; 中国时区
time_zone = Asia/Shanghai
